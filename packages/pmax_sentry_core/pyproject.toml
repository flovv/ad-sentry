[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmax-sentry-core"
version = "0.1.0"
description = "Core schemas, API client, normalization, and reconciliation for PMax Sentry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
google-ads = [
    "google-ads>=26.0.0",
]
pandas = [
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pmax_sentry_core*"]
