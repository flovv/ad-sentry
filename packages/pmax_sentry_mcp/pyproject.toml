[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmax-sentry-mcp"
version = "0.1.0"
description = "Read-only Model Context Protocol (MCP) server for PMax Sentry delivery audit and incrementality measurement"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pmax-sentry-core",
    "mcp>=1.0.0",
]

[project.scripts]
pmax-mcp = "pmax_sentry_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pmax_sentry_mcp*"]
