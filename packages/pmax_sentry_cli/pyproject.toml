[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmax-sentry"
version = "0.1.0"
description = "CLI audit tool for Google Ads Performance Max delivery observability and reconciliation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pmax-sentry-core",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
pmax-audit = "pmax_sentry_cli.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pmax_sentry_cli*"]
