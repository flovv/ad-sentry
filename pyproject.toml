[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmax-auditor-suite"
version = "0.1.0"
description = "Comprehensive Google Ads Performance Max delivery observability and incrementality measurement suite"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pmax-sentry-core",
    "pmax-sentry",
    "pmax-sentry-pro",
    "pmax-sentry-mcp",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "packages"]
